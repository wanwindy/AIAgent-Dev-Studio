complexity_levels:
- simple
- medium
- complex
description: 标准Web应用开发工作流
global_settings:
  auto_retry: true
  max_parallel_agents: 3
  max_retries: 2
  quality_threshold: 0.8
is_default: true
name: Web应用开发流程
project_types:
- web
- fullstack
- webapp
stages:
- agents:
  - master
  description: 分析项目需求，制定开发计划
  name: 需求分析
  parallel: false
  quality_gates:
  - requirements_analysis
  timeout_minutes: 30
- agents:
  - ui_design
  - database_design
  - documentation
  dependencies:
  - 需求分析
  description: UI设计和数据库设计
  name: 设计阶段
  parallel: true
  quality_gates:
  - design_review
  timeout_minutes: 60
- agents:
  - frontend
  - backend
  dependencies:
  - 设计阶段
  description: 前端和后端开发
  name: 开发阶段
  parallel: true
  quality_gates:
  - code_quality
  timeout_minutes: 120
- agents:
  - testing
  dependencies:
  - 开发阶段
  description: 代码测试和质量保证
  name: 测试阶段
  parallel: false
  quality_gates:
  - testing_coverage
  timeout_minutes: 45
- agents:
  - review
  - deployment
  dependencies:
  - 测试阶段
  description: 代码审查和部署准备
  name: 部署阶段
  parallel: false
  quality_gates:
  - deployment_readiness
  timeout_minutes: 30
