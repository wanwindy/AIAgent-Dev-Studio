version: '3.8'

services:
  multi-agent-dev:
    build: .
    container_name: multi-agent-dev-system
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RESULTS_DIR=/app/results
      - LOGS_DIR=/app/logs
      - GIT_ENABLED=${GIT_ENABLED:-false}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_PORT=8000
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./generated_projects:/app/generated_projects
      - ./.git:/app/.git:ro  # 只读挂载Git仓库
    ports:
      - "8000:8000"  # 监控指标端口
    restart: unless-stopped
    networks:
      - multi-agent-network
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Prometheus监控（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: multi-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - multi-agent-network
    profiles:
      - monitoring

  # Grafana仪表板（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: multi-agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - multi-agent-network
    profiles:
      - monitoring

networks:
  multi-agent-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
